# The bundle package is the only installable surface. It mounts its own
# manager and Settings UI exports; `mcp` / `mcp-oauth` stay ordinary library
# dependencies of those entries.
- insert:
    - id: mcp-mgmt-manager
      name: '@anht3889/dsh-mcp-mgmt-bundle/manager'
      config:
        catalogPath: !!js dshHomePath('mcp', 'servers.json')
        secretsPath: !!js dshHomePath('mcp', 'secrets.yaml')

    # Host stub so client-modules discovers this package's `./client` entry.
    - id: mcp-mgmt-ui
      name: '@anht3889/dsh-mcp-mgmt-bundle'
