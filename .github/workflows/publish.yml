name: Publish npm

# Publishes the three @anht3889 packages whose versions are already set in
# package.json. Bump versions in a commit first, then run this workflow (or
# create a GitHub Release). Already-published versions are skipped.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and print what would publish, but do not upload
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout dsh-mcp-management
        uses: actions/checkout@v4
        with:
          path: dsh-mcp-management

      - name: Setup workspace
        uses: ./dsh-mcp-management/.github/actions/setup-workspace
        with:
          harness-repository: ${{ vars.HARNESS_REPOSITORY || 'deepseek-ai/deepseek-harness' }}
          harness-ref: ${{ vars.HARNESS_REF }}
          harness-token: ${{ secrets.HARNESS_TOKEN || github.token }}
          registry-url: https://registry.npmjs.org

      - name: Build
        working-directory: dsh-mcp-management
        run: pnpm run build

      - name: Test
        working-directory: dsh-mcp-management
        run: pnpm run test

      - name: Publish packages
        working-directory: dsh-mcp-management
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: bash scripts/publish-npm.sh
