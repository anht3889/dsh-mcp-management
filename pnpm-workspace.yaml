packages:
  - 'packages/*'

# Harness peers come from the profile runtime, never from this workspace's tree;
# auto-installing them resolves prerelease peer ranges that are not published.
autoInstallPeers: false

minimumReleaseAgeExclude:
  - '@anht3889/dsh-mcp-mgmt-mcp@0.0.1-rc.1'
  - '@anht3889/dsh-mcp-mgmt-oauth@0.0.1-rc.1'
